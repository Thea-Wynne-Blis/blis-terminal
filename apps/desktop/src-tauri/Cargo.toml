[package]
name = "blis-terminal"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
dunce = "1"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.6", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2.5.5"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
open = "5.4.5"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
