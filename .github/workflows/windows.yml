name: Windows

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm build
      - name: Check Rust
        working-directory: apps/desktop/src-tauri
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build Windows installer
        run: pnpm bundle
      - uses: actions/upload-artifact@v4
        with:
          name: blis-terminal-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    # Only publish when a v* tag is pushed; ordinary branch pushes stay build-only.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blis-terminal-windows-x64
          path: dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Blis Terminal $TAG" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*.exe --clobber
